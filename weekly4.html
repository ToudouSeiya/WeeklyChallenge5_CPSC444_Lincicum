<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Lighting Scene Builder</title>

<style>
body{
    margin:0;
    overflow:hidden;
}

canvas{
    display:block;
}
</style>

<script id="vertex-shader" type="x-shader/x-vertex">

attribute vec4 aPosition;
attribute vec3 aNormal;

uniform mat4 uModel;
uniform mat4 uView;
uniform mat4 uProjection;

varying vec3 vNormal;

void main()
{
    vNormal = aNormal;

    gl_Position =
        uProjection *
        uView *
        uModel *
        aPosition;
}

</script>

<script id="fragment-shader" type="x-shader/x-fragment">

precision mediump float;

varying vec3 vNormal;

uniform vec3 uLightDirection;
uniform vec3 uLightColor;
uniform float uAmbient;
uniform vec3 uObjectColor;

void main()
{
    vec3 normal =
        normalize(vNormal);

    vec3 lightDir =
        normalize(uLightDirection);

    float diffuse =
        max(dot(normal, lightDir),0.0);

    vec3 ambient =
        vec3(uAmbient);

    vec3 color =
        (ambient + diffuse * uLightColor) *
        uObjectColor;

    gl_FragColor =
        vec4(color,1.0);
}

</script>

</head>

<body>

<canvas id="glcanvas"></canvas>

<script src="weekly4.js"></script>

</body>
</html>
